<!--
  Bracket overlay. OBS / TikTok Live Studio: Browser/Link source, Width 1920, Height 1080.
  Updates automatically when the admin confirms a match winner. ?bg=0 = no background.
-->
<body>
  <div class="stage bracket-stage" id="stage">
    <header class="bk-title">
      <span class="line"></span>
      <div><h1 id="title">HOLOWASTES</h1><div class="sub">Bracket</div></div>
      <span class="line"></span>
    </header>
    <svg class="links" id="links" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div id="cols"></div>
    <!-- where the tournament is right now (fills the empty space of the champion column) -->
    <section class="live-panel" id="live-panel"></section>
    <section class="next-panel" id="next-panel"></section>
  </div>

  <script src="js/config.js?v=20261128zz6"></script>
