<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hologram Overlay — HoloWastes</title>
  <script>window.HW_MODE = 'hologram';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css?v=20261128z2" />
  <link rel="stylesheet" href="css/overlay.css?v=20261128z2" />
  <link rel="stylesheet" href="css/holo.css?v=20261128z2" />
  <link rel="stylesheet" href="css/reels.css?v=20261128z2" />
</head>
<!--
  Hologram draft overlay. OBS / TikTok Live Studio: Browser / Link source at 1920 x 1080.
  Grey-to-black background built in; ?bg=0 = fully transparent.
-->
<body>
  <div class="stage holo-stage" id="stage">
    <header class="title"><span class="line"></span><h1 id="title">HOLOWASTES</h1><span class="line"></span></header>

    <section class="perma panel">
      <div class="label">Perma banned by the system</div>
      <div class="perma-list" id="perma"></div>
    </section>

    <section class="row top">
      <div class="panel player A"><div class="pname" id="name-A"></div><div class="hpoints" id="pts-A"></div></div>
      <div class="panel ban A" id="ban-A"></div>
      <div class="status" id="status">
        <div class="s-team" id="s-team"></div>
        <div class="s-action" id="s-action"></div>
        <div class="s-timer" id="s-timer"></div>
      </div>
      <div class="panel ban B" id="ban-B"></div>
      <div class="panel player B"><div class="hpoints" id="pts-B"></div><div class="pname" id="name-B"></div></div>
    </section>

    <section class="row bosses" id="bosses"></section>

    <section class="row teams">
      <div class="panel stage-box A" id="team-A"></div>
      <div class="panel stage-box B" id="team-B"></div>
    </section>
  </div>

  <script src="js/config.js?v=20261128z2"></script>
  <script src="js/bracket-core.js?v=20261128z2"></script>
  <script src="js/holo-core.js?v=20261128z2"></script>
  <script src="js/backend.js?v=20261128z2"></script>
  <script src="js/common.js?v=20261128z2"></script>
  <script src="js/holo-common.js?v=20261128z2"></script>
  <script src="js/holo-overlay.js?v=20261128z2"></script>
</body>
</html>
