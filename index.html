<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoloWastes</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=4" />
  <script>
    // Old Whimpering Wastes links (index.html?admin=… / ?team=…&key=… / ?local=1) keep working:
    // they are forwarded to the Whimpering Wastes control page with the same query.
    function hwForward(search) {
      const q = new URLSearchParams(search);
      return ['admin', 'team', 'key', 'local'].some((k) => q.has(k)) ? 'wastes.html?' + q.toString() : null;
    }
    const hwTarget = hwForward(location.search);
    if (hwTarget) location.replace(hwTarget);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css?v=20261128zz5" />
  <link rel="stylesheet" href="css/chooser.css?v=20261128zz5" />
  <link rel="stylesheet" href="css/gate.css?v=20261128zz5" />
</head>
<!-- Start page: pick the tournament. -->
<body class="chooser">
  <main>
    <img class="chooser-logo" src="img/logo.png" alt="HoloWastes Tournament" />
    <p class="chooser-lead">Choose a tournament</p>
    <div class="choices">
      <a class="choice holo" href="hologram.html" data-page="hologram.html" data-name="Hologram">
        <span class="kicker">Tactical Hologram</span>
        <b>Hologram</b>
        <span class="desc">3 random bosses · 1 team of 3 · points per boss</span>
        <span class="go">Enter →</span>
      </a>
      <a class="choice wastes" href="wastes.html" data-page="wastes.html" data-name="Whimpering Wastes">
        <span class="kicker">Pick &amp; ban</span>
        <b>Whimpering Wastes</b>
        <span class="desc">2 stages · 3 picks each per stage · higher total wins</span>
        <span class="go">Enter →</span>
      </a>
    </div>
    <p class="chooser-note">Organizers enter their code; everyone else can watch as a guest. Captains: use the link you were sent.</p>
  </main>

  <script src="js/config.js?v=20261128zz5"></script>
  <script src="js/gate.js?v=20261128zz5"></script>
  <script src="js/chooser.js?v=20261128zz5"></script>
</body>
</html>
