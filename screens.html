<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screens — HoloWastes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css?v=20261128z8" />
  <link rel="stylesheet" href="css/overlay.css?v=20261128z8" />
  <link rel="stylesheet" href="css/screens.css?v=20261128z8" />
</head>
<!--
  Screen-share overlay. OBS / TikTok Live Studio: Browser/Link source at 1920 x 1080,
  placed ABOVE the two screen captures. The two windows are transparent:
    Player A window: x 24,  y 128, 924 x 520
    Player B window: x 972, y 128, 924 x 520
  URL options:  ?stage=1 or ?stage=2  show only that stage's picks
                ?guides=1             fill the windows with alignment guides
                ?stage=1|2 also leaves a chat window between the team panels: 380 x 338 at x 770, y 718 (?chat=0 hides it)
                ?bg=0                 no background (the windows are always see-through)
-->
<body>
  <div class="stage screens-stage" id="stage">
    <header class="bar">
      <div class="panel plate A">
        <div class="pname" id="name-A"></div>
        <div class="ptotal"><span>Total</span><b id="total-A" data-sk="TA"></b></div>
      </div>
      <div class="center">
        <div class="mini-title" id="title">HOLOWASTES</div>
        <div class="stage-tag" id="stage-tag">VS</div>
      </div>
      <div class="panel plate B">
        <div class="ptotal"><span>Total</span><b id="total-B" data-sk="TB"></b></div>
        <div class="pname" id="name-B"></div>
      </div>
    </header>

    <div class="screen A" id="screen-A"><div class="guide" id="guide-A"></div></div>
    <div class="screen B" id="screen-B"><div class="guide" id="guide-B"></div></div>

    <section class="panel perma-strip">
      <span class="label">Perma banned by the system</span>
      <div class="perma-list" id="perma"></div>
    </section>

    <section class="panel team A" id="team-A"></section>
    <section class="panel team B" id="team-B"></section>
    <!-- ?stage=1|2 only: framed box with a gradient background between the team panels, for a chat source placed ABOVE the overlay -->
    <div class="chat-slot" id="chat-slot" hidden><div class="guide" id="guide-chat"></div></div>
  </div>

  <script src="js/config.js?v=20261128z8"></script>
  <script src="js/bracket-core.js?v=20261128z8"></script>
  <script src="js/draft-core.js?v=20261128z8"></script>
  <script src="js/backend.js?v=20261128z8"></script>
  <script src="js/common.js?v=20261128z8"></script>
  <script src="js/screens.js?v=20261128z8"></script>
</body>
</html>
